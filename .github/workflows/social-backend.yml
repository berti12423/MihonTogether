name: Social backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/SOCIAL_API.md'
      - '.github/workflows/social-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/SOCIAL_API.md'
      - '.github/workflows/social-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/backend/.cache/emulators
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test domain behavior
        run: npm test
      - name: Test demo-project callables and Rules
        run: npm run test:emulators | tee emulator-test.log
      - name: Upload emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: social-backend-diagnostics-${{ github.sha }}
          path: |
            backend/emulator-test.log
            backend/*-debug.log
          retention-days: 7
