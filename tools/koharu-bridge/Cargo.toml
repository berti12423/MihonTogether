[package]
name = "mihon-together-translator"
version = "0.1.0"
edition = "2024"
description = "Local HTTP bridge that runs Koharu's manga translation pipeline for the Mihon Together website reader."
license = "Apache-2.0"
publish = false

[[bin]]
name = "MihonTogether-Translator"
path = "src/main.rs"

# Koharu crates are pinned to the exact commit tested on Berti's PC.
# Cargo resolves Koharu's `workspace = true` inheritance inside the git
# checkout, so no local source tree is needed. Cargo.lock started as a copy of
# Koharu's own lock at that commit, so shared crates resolve to the versions
# Koharu tested.
[dependencies]
koharu-pipeline = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-config = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-scene = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-renderer = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-rasterizer = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3", default-features = false, features = ["native"] }
koharu-translator = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-ml = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }
koharu-runtime = { git = "https://github.com/koharu-rs/koharu", rev = "2c78c0cd6eeec4dbf607f0a22e3a7e1f932b6ff3" }

ab_glyph = "0.2.32"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1.12.1"
image = "0.25.10"
imageproc = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Koharu's workspace dev-profile tweaks (image code is unusably slow at opt-level 0).
[profile.dev]
debug = 1

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.koharu-rasterizer]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.postcard]
opt-level = 3
